# Root Databricks Asset Bundle definition for the MLOps reference platform.
#
# One bundle, one code path, three deployment targets (dev / staging / prod).
# Everything that differs between environments is a variable, never a code branch —
# so the artifact promoted to prod is the same code that passed staging.
#
# Governance model: a single Unity Catalog catalog (`workspace`) with one schema per
# environment (mlops_dev / mlops_staging / mlops_prod). Environment separation is
# enforced by schema-level grants: open in dev, service-principal-only in staging/prod.
#
# Where the metastore allows CREATE CATALOG, catalog-per-environment is the stronger
# posture (blast-radius isolation, simpler binding rules). Because both layouts are
# addressed through the same catalog_name/schema_name variables, migrating later is a
# variable change per target — no pipeline code moves. See docs/DEMO_SCRIPT.md.
bundle:
  name: databricks_mlops_platform

variables:
  catalog_name:
    description: Unity Catalog catalog holding ML assets for all environments.
    default: workspace
  schema_name:
    description: Per-environment schema holding this target's ML assets.
  model_name:
    description: Registered model name (unqualified).
    default: credit_risk_model
  experiment_name:
    description: MLflow experiment path for training runs.
    default: /Users/${workspace.current_user.userName}/${bundle.target}-mlops-platform-experiment
  # Governance thresholds are variables, not constants, so risk owners can tune them
  # per environment through a reviewed PR without touching pipeline code.
  approval_required:
    description: Whether promotion to champion requires a human approval gate.
    default: "false"
  psi_warn_threshold:
    description: Population Stability Index above which a drift warning is raised.
    default: "0.10"
  psi_retrain_threshold:
    description: PSI above which automated retraining is triggered.
    default: "0.25"

include:
  - ./resources/ml-artifacts-resource.yml
  - ./resources/feature-engineering-workflow-resource.yml
  - ./resources/model-workflow-resource.yml
  - ./resources/deployment-job-resource.yml
  - ./resources/batch-inference-workflow-resource.yml
  - ./resources/monitoring-resource.yml

targets:
  # Loosely controlled. Data scientists deploy here directly from a local IDE
  # (`databricks bundle deploy -t dev`) — this is the fast inner loop.
  dev:
    mode: development
    default: true
    variables:
      schema_name: mlops_dev
      approval_required: "false"
    workspace:
      host: https://dbc-aef35066-afa2.cloud.databricks.com

  # Tightly controlled. CI deploys here on PR; no local deploys. Integration tests
  # run end-to-end here before a merge is permitted.
  staging:
    mode: production
    variables:
      schema_name: mlops_staging
      approval_required: "false"
    workspace:
      host: https://dbc-aef35066-afa2.cloud.databricks.com
      # Deliberately NOT under /Workspace/Shared: that path is writable by every
      # workspace user, which would let anyone edit deployed staging code and defeat the
      # "CI/CD is the only way in" rule. In a real deployment this is the CI service
      # principal's own path.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      # The deploy identity is declared explicitly. In a real deployment this is the
      # environment's CI service principal, which is the only principal that may change
      # deployed assets.
      - level: CAN_MANAGE
        user_name: ${workspace.current_user.userName}
      # Everyone else gets read-only visibility: humans can inspect prod, not change it.
      - level: CAN_VIEW
        group_name: users

  # Production. CD-only deployment, human access view-only, promotion gated on
  # explicit approval.
  prod:
    mode: production
    variables:
      schema_name: mlops_prod
      approval_required: "true"
    workspace:
      host: https://dbc-aef35066-afa2.cloud.databricks.com
      # Restricted path — see the staging comment. Human access to prod is view-only and
      # changes arrive only through CD.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      # The deploy identity is declared explicitly. In a real deployment this is the
      # environment's CI service principal, which is the only principal that may change
      # deployed assets.
      - level: CAN_MANAGE
        user_name: ${workspace.current_user.userName}
      # Everyone else gets read-only visibility: humans can inspect prod, not change it.
      - level: CAN_VIEW
        group_name: users
