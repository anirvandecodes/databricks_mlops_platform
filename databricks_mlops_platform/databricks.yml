# Root Databricks Asset Bundle definition for the MLOps reference platform.
#
# One bundle, one code path, three deployment targets (dev / staging / prod).
# Everything that differs between environments is a variable, never a code branch —
# so the artifact promoted to prod is the same code that passed staging.
#
# Governance model: a single Unity Catalog catalog (`workspace`) with one schema
# per environment (payments_dev / payments_staging / payments_prod). Environment separation
# is enforced by schema-level grants: open in dev, service-principal-only in staging/prod.
#
# Where the metastore allows CREATE CATALOG, catalog-per-environment is the stronger posture
# (blast-radius isolation, simpler binding rules). Because both layouts are addressed through
# the same catalog_name/schema_name variables, migrating later is a variable change per
# target — no pipeline code moves. See docs/CUJ_DEMO.md.
bundle:
  name: databricks_mlops_platform

variables:
  catalog_name:
    description: Unity Catalog catalog holding ML assets for all environments.
    default: workspace
  schema_name:
    description: Per-environment schema holding this target's ML assets.
  model_name:
    description: Registered model name (unqualified).
    default: credit_risk_model
  experiment_name:
    description: MLflow experiment path for training runs.
    default: /Users/${workspace.current_user.userName}/${bundle.target}-mlops-platform-experiment
  # Governance thresholds are variables, not constants, so risk owners can tune them
  # per environment through a reviewed PR without touching pipeline code.
  approval_required:
    description: Whether promotion to champion requires a human approval gate.
    default: "false"
  psi_warn_threshold:
    description: Population Stability Index above which a drift warning is raised.
    default: "0.10"
  psi_retrain_threshold:
    description: PSI above which automated retraining is triggered.
    default: "0.25"
  # A/B experiment controls. Like the governance thresholds above, these are variables so a
  # risk owner can start, size, or stop an experiment through a reviewed PR rather than by
  # editing pipeline code. An experiment is off by default; enabling it in prod still faces
  # the experiment approval gate (see platform_utils/experiment.py).
  ab_enabled:
    description: Whether batch scoring and serving split traffic across two model versions.
    default: "false"
  ab_variant_b_alias:
    description: Alias of the model version served as A/B arm B (the challenger).
    default: "challenger"
  ab_traffic_split_pct:
    description: Integer percentage of traffic routed to arm B.
    default: "10"
  ab_split_salt:
    description: Cohort salt for deterministic batch assignment; changing it reshuffles arms.
    default: "credit_risk_ab_v1"
  # Cross-team feature-sharing demo (feature_sharing_demo/). Same catalog as the platform,
  # one set of schemas per target, so dev runs by hand never disturb what CI exercises.
  feature_demo_raw_schema:
    description: Source (raw) data read by Team A's feature pipeline.
    default: feature_demo_raw_${bundle.target}
  feature_demo_producer_schema:
    description: Team A's governed feature schema (Team A writes, others read).
    default: team_a_features_${bundle.target}
  feature_demo_consumer_schema:
    description: Team B's ML schema (labels, model, predictions).
    default: team_b_ml_${bundle.target}
  feature_demo_producer_group:
    description: Account group for Team A (granted MODIFY on the feature schema); blank = skip grants.
    default: ""
  feature_demo_consumer_group:
    description: Account group for Team B (granted SELECT on the feature schema); blank = skip grants.
    default: ""

include:
  - ./resources/ml-artifacts-resource.yml
  - ./resources/feature-engineering-workflow-resource.yml
  - ./resources/model-workflow-resource.yml
  - ./resources/deployment-job-resource.yml
  - ./resources/batch-inference-workflow-resource.yml
  - ./resources/monitoring-resource.yml
  - ./resources/serving-resource.yml
  - ./resources/feature-sharing-demo-resource.yml

targets:
  # Loosely controlled. Data scientists deploy here directly from a local IDE
  # (`databricks bundle deploy -t dev`) — this is the fast inner loop.
  dev:
    mode: development
    default: true
    variables:
      schema_name: payments_dev
      approval_required: "false"
      # A/B on in dev so a data scientist can exercise the experiment path freely; the
      # gate is disabled here (approval_required=false), so no sign-off is needed.
      ab_enabled: "true"
    workspace:
      # Literal, not a ${var.*} reference: the workspace host is resolved during auth
      # configuration, before variable interpolation runs, so a variable here fails with
      # "cannot resolve bundle auth configuration".
      host: https://dbc-aef35066-afa2.cloud.databricks.com

  # Tightly controlled. CI deploys here on PR; no local deploys. Integration tests
  # run end-to-end here before a merge is permitted.
  staging:
    mode: production
    variables:
      schema_name: payments_staging
      approval_required: "false"
      # A/B on in staging so the integration run exercises the two-arm scoring path.
      ab_enabled: "true"
    workspace:
      host: https://dbc-aef35066-afa2.cloud.databricks.com
      # Deliberately NOT under /Workspace/Shared: that path is writable by every
      # workspace user, which would let anyone edit deployed staging code and defeat the
      # "CI/CD is the only way in" rule. In a real deployment this is the CI service
      # principal's own path.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      # The deploy identity is declared explicitly. In a real deployment this is the
      # environment's CI service principal, which is the only principal that may change
      # deployed assets.
      - level: CAN_MANAGE
        user_name: ${workspace.current_user.userName}
      # Everyone else gets read-only visibility: humans can inspect prod, not change it.
      - level: CAN_VIEW
        group_name: users

  # Production. CD-only deployment, human access view-only, promotion gated on
  # explicit approval.
  prod:
    mode: production
    variables:
      schema_name: payments_prod
      approval_required: "true"
      # A/B off in prod by default: a live split serves the challenger to real customers, so
      # it stays disabled until a human turns it on — and even then approval_required=true
      # means the experiment approval gate must pass before any traffic reaches arm B.
      ab_enabled: "false"
    workspace:
      host: https://dbc-aef35066-afa2.cloud.databricks.com
      # Restricted path — see the staging comment. Human access to prod is view-only and
      # changes arrive only through CD.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      # The deploy identity is declared explicitly. In a real deployment this is the
      # environment's CI service principal, which is the only principal that may change
      # deployed assets.
      - level: CAN_MANAGE
        user_name: ${workspace.current_user.userName}
      # Everyone else gets read-only visibility: humans can inspect prod, not change it.
      - level: CAN_VIEW
        group_name: users
