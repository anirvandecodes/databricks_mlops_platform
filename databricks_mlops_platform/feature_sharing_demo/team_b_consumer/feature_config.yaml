# Team B's declared feature dependencies. Consumers never copy feature logic — they pin
# the exact columns they read from the producer's governed table. Pinning (never "all
# columns") is what lets producers add features without breaking anyone, and lets the
# governance check see exactly who depends on what.
model:
  name: ${catalog}.${consumer_schema}.default_risk_model
  label: defaulted_next_30d

spine_table: ${catalog}.${consumer_schema}.default_labels

feature_dependencies:
  - table: ${catalog}.${producer_schema}.customer_features
    contract_version: 1.0.0
    lookup_key: customer_id
    timestamp_lookup_key: as_of_date
    feature_names:
      - txn_count_30d
      - txn_amount_sum_30d
      - days_since_last_txn
