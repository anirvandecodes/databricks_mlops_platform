# Feature engineering workflow.
#
# Produces the feature table, the scoring input, and the ground-truth outcomes table.
# Scheduled ahead of training so features are always fresher than the model that consumes
# them.
common_permissions: &permissions
  permissions:
    - level: CAN_VIEW
      group_name: users

resources:
  jobs:
    write_feature_table_job:
      name: ${bundle.target}-mlops-platform-feature-engineering-job
      tasks:
        - task_key: ComputeCreditFeatures
          environment_key: default
          notebook_task:
            notebook_path: ../feature_engineering/GenerateAndWriteFeatures.py
            base_parameters:
              env: ${bundle.target}
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              # Fraction held out for batch scoring. Labels are stripped from this slice so
              # inference can never see the outcome it predicts.
              scoring_sample_fraction: "0.2"
              git_source_info: "url:${bundle.git.origin_url}; branch:${bundle.git.branch}; commit:${bundle.git.commit}"

      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - -r ../requirements.txt

      schedule:
        quartz_cron_expression: "0 0 7 * * ?" # daily 07:00 UTC, two hours before training
        timezone_id: UTC
        pause_status: PAUSED

      <<: *permissions
