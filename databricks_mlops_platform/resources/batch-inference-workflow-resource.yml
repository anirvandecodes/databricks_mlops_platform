common_permissions: &permissions
  permissions:
    - level: CAN_VIEW
      group_name: users

resources:
  jobs:
    batch_inference_job:
      name: ${bundle.target}-databricks_mlops_platform-batch-inference-job
      tasks:
        - task_key: batch_inference_job
          environment_key: default
          notebook_task:
            notebook_path: ../deployment/batch_inference/BatchInference.py
            base_parameters:
              env: ${bundle.target}
              input_table_name: ${bundle.target}.databricks_mlops_platform.feature_store_inference_input  # TODO: create input table for inference
              output_table_name: ${var.catalog_name}.databricks_mlops_platform.predictions
              model_name: ${var.catalog_name}.databricks_mlops_platform.${var.model_name}
              # git source information of current ML resource deployment. It will be persisted as part of the workflow run
              git_source_info: url:${bundle.git.origin_url}; branch:${bundle.git.branch}; commit:${bundle.git.commit}

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - -r ../requirements.txt
      schedule:
        quartz_cron_expression: "0 0 11 * * ?" # daily at 11am
        timezone_id: UTC
      <<: *permissions
      # If you want to turn on notifications for this job, please uncomment the below code,
      # and provide a list of emails to the on_failure argument.
      #
      #  email_notifications:
      #    on_failure:
      #      - first@company.com
      #      - second@company.com
