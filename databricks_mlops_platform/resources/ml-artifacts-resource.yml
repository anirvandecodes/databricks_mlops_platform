# ML artifacts: the registered model and the MLflow experiment.
#
# Declared as bundle resources rather than created imperatively, so these governed objects
# and their grants are reviewable in a pull request and identical across environments.
common_permissions: &permissions
  permissions:
    - level: CAN_READ
      group_name: users

resources:
  registered_models:
    model:
      name: ${var.model_name}
      catalog_name: ${var.catalog_name}
      schema_name: ${var.schema_name}
      comment: >-
        Credit-risk default-probability model for the ${bundle.target} environment.
        Promotion is alias-based: @challenger is a candidate, @champion serves traffic.
      grants:
        # EXECUTE only. Nothing outside the deployment workflow should be able to move an
        # alias — that restriction is what makes the approval gate binding rather than
        # advisory.
        - privileges:
            - EXECUTE
          principal: account users

  experiments:
    experiment:
      name: ${var.experiment_name}
      # Every run records the training-data Delta version, so any registered model can be
      # traced back to the exact input that produced it.
      <<: *permissions
