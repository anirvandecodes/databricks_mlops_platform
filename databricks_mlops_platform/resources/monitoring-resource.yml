# Monitoring workflow: drift detection and gated retraining.
#
# The governance principle encoded here: drift triggers model *building*, never model
# *promotion*. The retraining branch runs model_training_job, which registers a
# challenger and stops at the approval gate. Automated drift response is therefore never
# an unreviewed path into production.
common_permissions: &permissions
  permissions:
    - level: CAN_VIEW
      group_name: users

resources:
  jobs:
    monitoring_job:
      name: ${bundle.target}-mlops-platform-monitoring-job
      tasks:
        # 1. Register the PSI UC function and attach the Lakehouse Monitor. Idempotent, so
        #    it is safe to leave in the scheduled path rather than needing a manual step.
        - task_key: SetupMonitor
          environment_key: default
          notebook_task:
            notebook_path: ../monitoring/SetupMonitor.py
            base_parameters:
              env: ${bundle.target}
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              model_name: ${var.model_name}

        # 2. Compute PSI per monitored feature against the training baseline.
        - task_key: DriftCheck
          environment_key: default
          depends_on:
            - task_key: SetupMonitor
          notebook_task:
            notebook_path: ../monitoring/DriftCheck.py
            base_parameters:
              env: ${bundle.target}
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              model_name: ${var.model_name}
              psi_warn_threshold: ${var.psi_warn_threshold}
              psi_retrain_threshold: ${var.psi_retrain_threshold}

        # 3. Branch on the drift verdict.
        - task_key: IsRetrainRequired
          depends_on:
            - task_key: DriftCheck
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.DriftCheck.values.retrain_required}}"
            right: "true"

        # 4. Only on breach. Runs the full training workflow, so the retrained model still
        #    faces validation and the approval gate.
        - task_key: TriggerRetraining
          depends_on:
            - task_key: IsRetrainRequired
              outcome: "true"
          run_job_task:
            job_id: ${resources.jobs.model_training_job.id}

      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - -r ../requirements.txt

      schedule:
        quartz_cron_expression: "0 0 18 * * ?" # daily 18:00 UTC, after the day's scoring
        timezone_id: UTC
        pause_status: PAUSED

      <<: *permissions
