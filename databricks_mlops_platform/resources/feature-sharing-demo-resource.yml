# Feature-sharing demo (feature_sharing_demo/). A producer builds every governed feature
# table under features/<table>/ from its self-contained contract + SQL (generating its own
# mock source data); a consumer reads them and shows Unity Catalog lineage; a governance job
# reports what depends on a table/column (the same lookup as the PR check). Schemas are per
# target. CI/CD is .github/workflows/feature_sharing_demo-contract-check.yml and the
# feature_sharing_demo job in databricks_mlops_platform-bundle-cd-staging.yml.
resources:
  jobs:
    # Producer: build every feature table under features/ from its folder (contract + SQL).
    feature_producer:
      name: ${bundle.target}-feature-demo-producer
      tags: {project: feature-sharing-demo, role: producer}
      tasks:
        - task_key: build_feature_tables
          notebook_task:
            notebook_path: ../feature_sharing_demo/producer.py
            base_parameters:
              features_root: ${workspace.file_path}/feature_sharing_demo/features
              catalog: ${var.catalog_name}
              raw_schema: ${var.feature_demo_raw_schema}
              producer_schema: ${var.feature_demo_producer_schema}
      max_concurrent_runs: 1

    # Consumer: read the feature table(s) and show lineage.
    feature_consumer:
      name: ${bundle.target}-feature-demo-consumer
      tags: {project: feature-sharing-demo, role: consumer}
      tasks:
        - task_key: show_lineage
          notebook_task:
            notebook_path: ../feature_sharing_demo/consumer.py
            base_parameters:
              catalog: ${var.catalog_name}
              producer_schema: ${var.feature_demo_producer_schema}
      max_concurrent_runs: 1

    # Governance: what depends on a feature table / column? The same lookup as the PR check
    # (governance/dependencies.py). With fail_if_active=true it is the removal gate (fails
    # while anything still depends on the column).
    feature_consumers_check:
      name: ${bundle.target}-feature-demo-feature-consumers-check
      tags: {project: feature-sharing-demo, role: governance}
      parameters:
        - name: column
          default: ""
        - name: fail_if_active
          default: "false"
      tasks:
        - task_key: find_consumers
          notebook_task:
            notebook_path: ../feature_sharing_demo/governance/notebooks/find_feature_consumers.py
            base_parameters:
              table: ${var.catalog_name}.${var.feature_demo_producer_schema}.customer_features
              column: "{{job.parameters.column}}"
              fail_if_active: "{{job.parameters.fail_if_active}}"
      max_concurrent_runs: 1
