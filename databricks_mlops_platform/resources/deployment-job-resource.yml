# Rollback workflow.
#
# Deliberately a standalone, on-demand job with no schedule and no approval gate. During
# an incident the operator needs one command, not a pipeline:
#
#   databricks bundle run rollback_job -t prod
#   databricks bundle run rollback_job -t prod --params target_version=11,reason="AUC decay"
#
# Requiring sign-off to *stop* serving a bad model would prolong the incident. The
# rollback is still fully audited to the same Volume as promotions.
common_permissions: &permissions
  permissions:
    - level: CAN_VIEW
      group_name: users

resources:
  jobs:
    rollback_job:
      name: ${bundle.target}-mlops-platform-rollback-job

      # Overridable at run time via --params, with safe defaults: blank target_version
      # means "the version immediately before the current champion".
      parameters:
        - name: target_version
          default: ""
        - name: reason
          default: "manual rollback"

      tasks:
        - task_key: RollbackChampion
          environment_key: default
          notebook_task:
            notebook_path: ../deployment/model_deployment/Rollback.py
            base_parameters:
              env: ${bundle.target}
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              model_name: ${var.model_name}
              target_version: "{{job.parameters.target_version}}"
              reason: "{{job.parameters.reason}}"

      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - -r ../requirements.txt

      <<: *permissions
