# Model training workflow: Train -> Validate -> Approve -> Deploy.
#
# The ordering is the governance story. Each task can only block the next one, never skip
# it, so there is no path from "a model was trained" to "a model serves traffic" that
# bypasses validation and approval.
common_permissions: &permissions
  permissions:
    - level: CAN_VIEW
      group_name: users

resources:
  jobs:
    model_training_job:
      name: ${bundle.target}-mlops-platform-model-training-job
      tasks:
        # 1. Train a candidate and register it as @challenger. Never touches @champion.
        - task_key: Train
          environment_key: default
          notebook_task:
            notebook_path: ../training/Train.py
            base_parameters:
              env: ${bundle.target}
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              model_name: ${var.model_name}
              experiment_name: ${var.experiment_name}
              git_source_info: "url:${bundle.git.origin_url}; branch:${bundle.git.branch}; commit:${bundle.git.commit}"

        # 2. Automated quality bar. In staging/prod run_mode=enabled, so a candidate that
        #    misses a threshold fails here and never reaches a human reviewer.
        - task_key: ModelValidation
          environment_key: default
          depends_on:
            - task_key: Train
          notebook_task:
            notebook_path: ../validation/ModelValidation.py
            base_parameters:
              run_mode: enabled
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              model_name: ${var.model_name}
              targets: class
              git_source_info: "url:${bundle.git.origin_url}; branch:${bundle.git.branch}; commit:${bundle.git.commit}"

        # 3. Stage-2 model gate. In prod (approval_required=true) this fails unless a
        #    reviewer has tagged the version approval_status=approved.
        - task_key: ApprovalGate
          environment_key: default
          depends_on:
            - task_key: ModelValidation
          notebook_task:
            notebook_path: ../deployment/approval/ApprovalGate.py
            base_parameters:
              env: ${bundle.target}
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              model_name: ${var.model_name}
              approval_required: ${var.approval_required}

        # 4. Write the audit evidence, then move @champion.
        - task_key: ModelDeployment
          environment_key: default
          depends_on:
            - task_key: ApprovalGate
          notebook_task:
            notebook_path: ../deployment/model_deployment/ModelDeployment.py
            base_parameters:
              env: ${bundle.target}
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              model_name: ${var.model_name}
              approval_required: ${var.approval_required}
              git_source_info: "url:${bundle.git.origin_url}; branch:${bundle.git.branch}; commit:${bundle.git.commit}"

      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - -r ../requirements.txt

      # Paused by default. A demo environment should not accumulate unattended runs; the
      # schedule documents the intended cadence and is unpaused per environment.
      schedule:
        quartz_cron_expression: "0 0 9 * * ?" # daily 09:00 UTC, after feature engineering
        timezone_id: UTC
        pause_status: PAUSED

      <<: *permissions
