# Stage-1 code gate, part 1: tests.
#
# This and the bundle-validation workflow are what a branch protection rule requires
# before a merge into main is allowed. Together they are the "code gate" — they establish
# that the code is sound. They say nothing about whether a particular trained model should
# serve traffic; that is the separate model gate enforced at deploy time.
name: Tests for databricks_mlops_platform

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "databricks_mlops_platform/**"
      - ".github/workflows/databricks_mlops_platform-run-tests.yml"

defaults:
  run:
    working-directory: ./databricks_mlops_platform

concurrency:
  # Cancel superseded runs on the same PR: only the latest commit's verdict matters.
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Level 1 — fast, offline. Feature transforms, PSI, promotion logic, policy rules.
  # No workspace credentials required, so this runs on every PR including from forks.
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Vanilla pyspark (not databricks-connect) so the local Spark fixture works here.
          pip install pyspark==3.5.3
          pip install -r ../test-requirements.txt
          pip install mlflow scikit-learn lightgbm pandas numpy

      - name: Run unit tests
        run: pytest tests/unit -v --tb=short

  # Level 2 — against a real workspace. Verifies that what is deployed to Unity Catalog
  # behaves as the unit tests assume: the approval gate actually blocks, aliases actually
  # roll back, and the SQL functions match their Python mirrors.
  integration_tests:
    needs: unit_tests
    runs-on: ubuntu-latest
    # Skipped on forks, which cannot access repository secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      MLOPS_TEST_CATALOG: ${{ vars.MLOPS_TEST_CATALOG || 'workspace' }}
      MLOPS_TEST_SCHEMA: ${{ vars.MLOPS_TEST_SCHEMA || 'payments_staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # databricks-connect here (not pyspark): these tests must run against real
          # compute, and Connect is also what developers use locally.
          pip install databricks-connect==16.1.* databricks-sdk
          pip install -r ../test-requirements.txt
          pip install mlflow scikit-learn pandas numpy

      - name: Run integration tests
        run: pytest tests/integration -v --tb=short
