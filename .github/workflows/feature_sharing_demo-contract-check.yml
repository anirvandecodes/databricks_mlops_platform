# Feature-sharing demo gate. The steps run in order and any failure stops the run, so the
# feature tables are only (re)built when every check passed:
#
#   1. contract rules unit tests
#   2. bundle config resolves
#   3. each changed feature table is a safe change (released features immutable, SQL compiles,
#      nothing in Unity Catalog that reads it would break)   <- fails here = stop, nothing created
#   4. create the feature tables (producer)                  <- only reached if 1-3 passed
#
# On a pull request steps 1-3 run as the merge gate (make "Check, then create features" a
# required status check on main). On a push to main / manual run, step 4 also runs.
name: Feature contract check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "databricks_mlops_platform/feature_sharing_demo/**"
      - "databricks_mlops_platform/resources/feature-sharing-demo-resource.yml"
      - ".github/workflows/feature_sharing_demo-contract-check.yml"
  push:
    branches: [main]
    paths:
      - "databricks_mlops_platform/feature_sharing_demo/**"

defaults:
  run:
    working-directory: ./databricks_mlops_platform/feature_sharing_demo

concurrency:
  group: feature-contract-check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  check-and-create:
    name: Check, then create features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: databricks_mlops_platform/feature_sharing_demo/requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - uses: databricks/setup-cli@main

      # 1. Contract rules.
      - name: Contract rule tests
        run: pytest tests -q

      # 2. Bundle config resolves for staging (the demo ships in the platform bundle).
      - name: Validate bundle
        working-directory: ./databricks_mlops_platform
        run: databricks bundle validate -t staging

      # 3. Every changed feature table (features/<table>/) is a safe change. A failure here
      #    fails the job, so step 4 never runs.
      - name: Feature contract check
        env:
          BASE: origin/${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          vars=$(cd .. && databricks bundle validate -t staging -o json | jq '.variables')
          v() { jq -r ".$1.value" <<<"$vars"; }
          git worktree add -q /tmp/base "$BASE" 2>/dev/null || true
          for dir in features/*/; do
            contract=$(ls "$dir"*.yaml | head -1)
            base="/tmp/base/databricks_mlops_platform/feature_sharing_demo/$contract"
            [[ -f "$base" ]] || base="$contract"   # new table: nothing on base, compare with itself
            echo "::group::$contract"
            python governance/check_change.py --base "$base" --proposed "$contract" \
              --var catalog="$(v catalog_name)" \
              --var producer_schema="$(v feature_demo_producer_schema)" \
              --var raw_schema="$(v feature_demo_raw_schema)"
            echo "::endgroup::"
          done

      # 4. All checks passed — build the feature tables. Skipped on PRs (gate only).
      - name: Create the feature tables
        if: github.event_name != 'pull_request'
        working-directory: ./databricks_mlops_platform
        run: |
          databricks bundle deploy -t staging
          databricks bundle run feature_producer -t staging
