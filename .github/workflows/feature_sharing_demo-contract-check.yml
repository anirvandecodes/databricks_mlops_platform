# Feature-sharing demo, PR gate. Every PR that touches the demo runs the contract-rule unit
# tests and validates the bundle. Every PR that edits a released contract is diffed against
# the base branch by check_change.py, which asks Unity Catalog (staging and prod) whether any
# live model, job, pipeline or dashboard reads a column the PR changes or removes — and fails
# the PR if one does, or if that can't be determined.
# Approval is a code-owner review (CODEOWNERS). Make "Downstream impact (live model
# registry)" a required status check on main, together with "Require review from Code Owners".
name: Feature contract check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "databricks_mlops_platform/feature_sharing_demo/**"
      - "databricks_mlops_platform/resources/feature-sharing-demo-resource.yml"
      - ".github/workflows/feature_sharing_demo-contract-check.yml"

defaults:
  run:
    working-directory: ./databricks_mlops_platform/feature_sharing_demo

concurrency:
  group: feature-contract-check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Contract rules (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pyyaml pytest
      - run: pytest tests -v

  downstream:
    name: Downstream impact (live model registry)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: databricks/setup-cli@main
      - run: pip install pyyaml databricks-sdk
      - name: Check every changed contract against the models that read it
        env:
          BASE: origin/${{ github.base_ref }}
          DEMO: databricks_mlops_platform/feature_sharing_demo
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # git diff prints repo-relative paths; check_change.py runs from the demo folder.
          contracts=$(git diff --name-only --diff-filter=M "$BASE"...HEAD -- team_a_producer/contracts)
          if [[ -z "$contracts" ]]; then
            echo "No released contract changed in this PR." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          status=0
          : > /tmp/report.md
          : > /tmp/summary.txt
          for c in $contracts; do
            git show "$BASE:$c" > /tmp/base.yaml
            # Consumers live in every environment the contract is released to.
            for target in staging prod; do
              # Only the variables are needed; validate's warnings are noise here.
              vars=$(cd .. && databricks bundle validate -t "$target" -o json 2>/tmp/validate.err | jq '.variables') \
                || { cat /tmp/validate.err; exit 1; }
              v() { jq -r ".$1.value" <<<"$vars"; }
              echo "::group::${c##*/} in $target"
              result=OK
              python governance/check_change.py --base /tmp/base.yaml --proposed "${c#"$DEMO"/}" \
                --var catalog="$(v catalog_name)" \
                --var producer_schema="$(v feature_demo_producer_schema)" \
                --var raw_schema="$(v feature_demo_raw_schema)" \
                > /tmp/check.txt 2> >(tee /tmp/progress.txt >&2) || { status=1; result=BLOCKED; }
              # Progress streams live above (stderr); the report below is what goes into the PR comment.
              [[ -s /tmp/check.txt ]] || { echo "The check crashed:"; tail -20 /tmp/progress.txt; } > /tmp/check.txt
              echo "──────── report ($target) ────────"
              cat /tmp/check.txt
              echo "::endgroup::"
              printf '  %-8s %-8s %s\n' "$target" "$result" "${c##*/}" >> /tmp/summary.txt
              # Each reason as a PR annotation, plus an indented line for the summary.
              grep '^  x ' /tmp/check.txt | sed 's/^  x //' | while read -r reason; do
                echo "::error title=Blocked in $target::$reason"
                echo "             $reason" >> /tmp/summary.txt
              done || true
              { echo "#### \`${c##*/}\` — $target: $result"; echo '```'; cat /tmp/check.txt; echo '```'; } >> /tmp/report.md
            done
          done
          echo
          echo "Feature contract check"
          cat /tmp/summary.txt
          if [[ $status == 0 ]]; then echo "Overall: OK to merge"
          else echo "Overall: BLOCKED (expand the groups above for details)"; fi
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"
          {
            if [[ $status == 0 ]]; then echo "### ✅ Feature contract check: safe to merge"
            else echo "### ❌ Feature contract check: blocked (details below)"; fi
            echo
            echo '```'; cat /tmp/summary.txt; echo '```'
            echo
            cat /tmp/report.md
          } > /tmp/comment.md
          # One comment per PR, updated on every push.
          gh pr comment "$PR" --body-file /tmp/comment.md --edit-last 2>/dev/null \
            || gh pr comment "$PR" --body-file /tmp/comment.md
          exit $status

  # The demo is part of the platform bundle. The platform's own bundle-ci skips demo-only
  # PRs (its staging run retrains the credit model), so the bundle is validated here instead.
  bundle-validate:
    name: Bundle config resolves (${{ matrix.target }})
    runs-on: ubuntu-latest
    # Skipped on forks, which cannot access repository secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        target: [dev, staging, prod]
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    defaults:
      run:
        working-directory: ./databricks_mlops_platform
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t ${{ matrix.target }}
