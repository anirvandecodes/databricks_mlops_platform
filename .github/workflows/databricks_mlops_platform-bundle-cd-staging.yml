# Staging CD. Triggered by a merge into main.
#
# Staging sets approval_required=false, so the full chain — train, validate, gate, promote —
# runs unattended here. That is intentional: staging is where the pipeline proves it works
# end to end without a human in the loop, so that the only thing still to verify at release
# time is the model itself.
name: Deploy to staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

defaults:
  run:
    working-directory: ./databricks_mlops_platform

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  deploy:
    name: Deploy and exercise the pipeline
    runs-on: ubuntu-latest
    concurrency: staging-bundle-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main

      - name: Validate bundle for staging
        run: databricks bundle validate -t staging

      - name: Deploy bundle to staging
        run: databricks bundle deploy -t staging

      - name: Refresh features
        run: databricks bundle run write_feature_table_job -t staging

      - name: Train, validate and promote
        run: databricks bundle run model_training_job -t staging

      - name: Score and decide
        run: databricks bundle run batch_inference_job -t staging

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Staging deployment"
            echo "Commit \`${{ github.sha }}\` deployed and exercised end to end."
            echo ""
            echo "Promote to production by pushing a \`release/<name>\` branch. Production"
            echo "requires explicit model approval before any version serves traffic."
          } >> "$GITHUB_STEP_SUMMARY"
