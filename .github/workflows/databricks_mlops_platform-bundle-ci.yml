# Stage-1 code gate, part 2: bundle validation.
#
# Validates the bundle against all three targets on every PR. Catching a bad prod variable
# here — rather than at release time — is the point: the same config that will deploy to
# prod is checked while the change is still reviewable.
name: Bundle validation for databricks_mlops_platform

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "databricks_mlops_platform/**"
      - ".github/workflows/databricks_mlops_platform-bundle-ci.yml"

defaults:
  run:
    working-directory: ./databricks_mlops_platform

concurrency:
  group: bundle-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    strategy:
      # fail-fast off: knowing that dev passes while prod fails is more useful than a
      # single early abort.
      fail-fast: false
      matrix:
        target: [dev, staging, prod]
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: databricks/setup-cli@main

      - name: Validate bundle for ${{ matrix.target }}
        run: databricks bundle validate -t ${{ matrix.target }}

  # Deploys to staging and runs the pipeline end to end. This is the check that would have
  # caught every real defect found while building this platform — an MLflow API rename, a
  # baseline/inference schema mismatch, a create-only SDK argument. None were visible to
  # unit tests or to bundle validation.
  staging_integration:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    concurrency: staging-integration
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: databricks/setup-cli@main

      - name: Deploy to staging
        run: databricks bundle deploy -t staging

      - name: Run feature engineering
        run: databricks bundle run write_feature_table_job -t staging

      - name: Run training, validation and promotion
        # staging sets approval_required=false, so the whole chain runs unattended and any
        # failure in it blocks the merge.
        run: databricks bundle run model_training_job -t staging

      - name: Run batch inference and decision layer
        run: databricks bundle run batch_inference_job -t staging

      - name: Summarise
        if: always()
        run: |
          echo "### Staging integration test" >> "$GITHUB_STEP_SUMMARY"
          echo "Pipeline exercised: features -> train -> validate -> gate -> promote -> score -> decide." >> "$GITHUB_STEP_SUMMARY"
