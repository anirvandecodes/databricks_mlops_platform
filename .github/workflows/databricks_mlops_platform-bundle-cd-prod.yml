# Production CD. Triggered by a push to the release branch.
#
# The deployment is split into two jobs on purpose:
#
#   deploy  — pushes code and job definitions to prod. Always safe: deploying a bundle
#             changes no model alias, so production keeps serving the current champion.
#   train   — runs the training workflow, which halts at the approval gate because prod
#             sets approval_required=true.
#
# So a merge to release never silently changes what production serves. It stages a
# candidate and waits for a reviewer. The GitHub "production" environment adds an
# optional second control: if configured with required reviewers, the train job itself
# needs sign-off before it even starts.
name: Prod CD for databricks_mlops_platform

on:
  push:
    branches:
      - release
  workflow_dispatch:

defaults:
  run:
    working-directory: ./databricks_mlops_platform

env:
  # One credential pair for every environment, matching this deployment: staging and prod
  # live in the same workspace and are separated by Unity Catalog schema, not by workspace.
  #
  # Where staging and prod are genuinely separate workspaces, define these as *environment*
  # secrets (Settings > Environments) rather than repository secrets. Prod credentials are
  # then unreachable from any workflow that does not target the production environment,
  # which a shared repository secret cannot enforce.
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: prod-bundle-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main

      - name: Validate bundle for prod
        run: databricks bundle validate -t prod

      - name: Deploy bundle to prod
        # Deploys code and job definitions only. No alias moves, so this cannot change
        # what production is currently serving.
        run: databricks bundle deploy -t prod

  train_and_stage_candidate:
    needs: deploy
    runs-on: ubuntu-latest
    concurrency: prod-training
    # Maps to a GitHub Environment. Add required reviewers there to gate the run itself,
    # in addition to the in-pipeline model gate.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main

      - name: Run training workflow
        # Expected to FAIL at the ApprovalGate task when the newly trained version has no
        # approval tag. That failure is the control working as designed, not a broken
        # pipeline — see the step below.
        id: train
        continue-on-error: true
        run: databricks bundle run model_training_job -t prod

      - name: Report promotion status
        run: |
          if [ "${{ steps.train.outcome }}" = "success" ]; then
            echo "### Model promoted to champion" >> "$GITHUB_STEP_SUMMARY"
            echo "The candidate carried a valid approval tag and is now serving." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Candidate awaiting approval" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Training and validation completed; promotion is blocked pending review." >> "$GITHUB_STEP_SUMMARY"
            echo "Production continues to serve the existing champion." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "To approve, set these tags on the new model version in Unity Catalog:" >> "$GITHUB_STEP_SUMMARY"
            echo '  approval_status = approved' >> "$GITHUB_STEP_SUMMARY"
            echo '  approved_by     = <reviewer>' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Then re-run only the gate:" >> "$GITHUB_STEP_SUMMARY"
            echo '  databricks bundle run model_training_job -t prod --only ApprovalGate' >> "$GITHUB_STEP_SUMMARY"
          fi
