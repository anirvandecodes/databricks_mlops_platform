# Feature contract check — the gate on every PR to this repo, whichever team opens it.
# Different teams add and change feature tables here, so nothing merges unchecked. The steps
# run in order and any failure stops the run, so the tables are only (re)built when every
# check passed:
#
#   1. contract rules unit tests
#   2. bundle config resolves
#   3. every feature table under features/ (governance/check_all.py):
#        changed table -> released features immutable, semver + changelog, SQL compiles,
#                         nothing in Unity Catalog that reads it would break
#        new table     -> valid contract, SQL compiles, table name free
#        deleted table -> blocked                       <- fails here = stop, nothing created
#   4. build the tables + provision access (feature_tables job), then the consumer
#                                                       <- only on main, after 1-3 passed
#
# So the feature_tables job never runs from a PR: a PR only gets checks 1-3, and the tables
# are built once it has merged to main — where 1-3 run again first, comparing main with the
# commit before the merge, so a push that skipped the PR is checked too. Each table is
# checked where it lives in staging (its staging server in the contract). In staging/prod
# only the CI identity can deploy or run jobs (other users get CAN_VIEW in databricks.yml).
#
# Make "Check, then create features" a required status check on main, and turn on "Require
# review from Code Owners" so each table's owning team (CODEOWNERS) approves its changes.
#
# ROOT is where this repo's files are: "." once this folder is its own repo.
name: Feature contract check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

env:
  ROOT: "."
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

concurrency:
  group: feature-contract-check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check-and-create:
    name: Check, then create features
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.ROOT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ env.ROOT }}/requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - uses: databricks/setup-cli@main

      # 1. Contract rules.
      - name: Contract rule tests
        run: pytest tests -q

      # 2. Bundle config resolves for staging. (Where each table lives comes from its contract's
      #    servers:, checked in step 3 — the bundle only says which environment this is.)
      - name: Validate bundle
        run: databricks bundle validate -t staging

      # 3. Every feature table is a safe change. A failure here fails the job, so step 4
      #    never runs.
      - name: Feature contract check
        env:
          # PR: the branch it merges into. Push to main: the commit before the push.
          BASE: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref || 'main') }}
        run: |
          set -euo pipefail
          git worktree add -q --detach /tmp/base "$BASE"   # no base = no comparison: fail the run
          python governance/check_all.py --env staging --base-root "/tmp/base/$ROOT"

      # 4. All checks passed — build the tables, provision access, read them. Skipped on PRs.
      - name: Create the feature tables and provision access
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          databricks bundle deploy -t staging
          databricks bundle run feature_tables -t staging
          databricks bundle run feature_consumer -t staging
